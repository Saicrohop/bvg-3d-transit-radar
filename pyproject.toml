[project]
name = "bvg-3d-radar"
version = "0.1.0"
description = "Backend-only GTFS-Realtime interpolation engine for BVG/VBB radar data."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "gtfs-realtime-bindings>=1.0,<2",
    "psutil>=7.2.2",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvg_radar"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
